[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-en-llm-evaluation-toolkit"
version = "0.1.0"
description = "A public-safe toolkit for Vietnamese-English LLM evaluation workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ngo Van Duong" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8,<2",
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
vi-en-eval = "vi_en_eval.jsonl_validator:main"

[project.urls]
Homepage = "https://github.com/ngovanduong-dev/vi-en-llm-evaluation-toolkit"
Issues = "https://github.com/ngovanduong-dev/vi-en-llm-evaluation-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vi_en_eval*"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=vi_en_eval --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["vi_en_eval"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.coverage.paths]
source = [
  "src/vi_en_eval",
  "*/site-packages/vi_en_eval",
]

[tool.bandit]
exclude_dirs = ["tests"]
